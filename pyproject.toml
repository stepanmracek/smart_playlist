[project]
name = "smart_playlist"
version = "0.1.0"
description = "Smart MPD playlist: appends songs similar to the current one, based on audio embeddings"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "av>=19.0.2",
    "numpy>=2.5.5",
    "onnxruntime>=1.32.0",
    "python-mpd2>=3.1.1",
    "tqdm>=4.70.1",
]

[dependency-groups]
# marimo notebooks in notebooks/ (installed by default; `uv sync --no-dev` skips them)
dev = [
    "altair>=6.3.0",
    "essentia-tensorflow>=2.1b6.dev1438",
    "huggingface-hub>=2.4.0",
    "librosa>=1.0.1",
    "marimo>=0.25.2",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "torch>=2.15.0",
    "transformers>=5.23.0",
    "umap-learn>=0.6.0",
]

[tool.uv]
package = false  # plain scripts, not an installable package

# CPU-only PyTorch (the default PyPI wheels pull in GBs of CUDA libraries)
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
